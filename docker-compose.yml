services:
  cropsense-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cropsense:latest
    container_name: cropsense-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
